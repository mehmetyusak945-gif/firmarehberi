    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Webmaster Tools & Analytics - Loaded from database -->
    <script>
      (async function() {
        try {
          const response = await fetch('https://wzpjmnjzfismjozhapmq.supabase.co/rest/v1/webmaster_settings?select=*', {
            headers: {
              'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind6cGptbmp6ZmlzbWpvemhhcG1xIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjE3NzU3MzcsImV4cCI6MjA3NzM1MTczN30.FGJc1BfX3plS50am-GdBUI3qvY0UYKqAQAl_BjLDY2M',
              'Content-Type': 'application/json'
            }
          });
          const data = await response.json();
          const settings = data[0];
          
          if (settings) {
            // Google Search Console
            if (settings.google_search_console_meta) {
              const tempDiv = document.createElement('div');
              tempDiv.innerHTML = settings.google_search_console_meta.trim();
              const metaElement = tempDiv.querySelector('meta');
              if (metaElement) {
                document.head.appendChild(metaElement.cloneNode(true));
              }
            }
            
            // Yandex Webmaster
            if (settings.yandex_webmaster_meta) {
              const tempDiv = document.createElement('div');
              tempDiv.innerHTML = settings.yandex_webmaster_meta.trim();
              const metaElement = tempDiv.querySelector('meta');
              if (metaElement) {
                document.head.appendChild(metaElement.cloneNode(true));
              }
            }
            
            // Bing Webmaster
            if (settings.bing_webmaster_meta) {
              const tempDiv = document.createElement('div');
              tempDiv.innerHTML = settings.bing_webmaster_meta.trim();
              const metaElement = tempDiv.querySelector('meta');
              if (metaElement) {
                document.head.appendChild(metaElement.cloneNode(true));
              }
            }
            
            // Google Analytics
            if (settings.google_analytics_code) {
              const tempDiv = document.createElement('div');
              tempDiv.innerHTML = settings.google_analytics_code.trim();
              const scripts = tempDiv.querySelectorAll('script');
              scripts.forEach((script) => {
                const newScript = document.createElement('script');
                if (script.src) {
                  newScript.src = script.src;
                  newScript.async = true;
                } else {
                  newScript.textContent = script.textContent;
                }
                document.head.appendChild(newScript);
              });
            }
          }
        } catch (e) {
          console.error('Webmaster ayarları yüklenemedi:', e);
        }
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
